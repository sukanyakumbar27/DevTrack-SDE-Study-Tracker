spring.application.name=devtrack
server.port=8080

# ---- Database (override with environment variables, see .env.example) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devtrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically and KEEPS existing data across restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Security ----
# JWT secret must be at least 32 characters. CHANGE IT for any real deployment.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-something-long-and-random-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
